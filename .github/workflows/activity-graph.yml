name: Generate Activity Graph

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activity-graph.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: activity-graph-output
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: nghiaphamhb
          options: >-
            bg_color=0d1117&color=ffe082&line=ffca28&point=5bcdec&area=true&hide_border=true&hide_title=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-activity
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
